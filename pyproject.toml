[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "sermon-processor"
version = "0.1.0"
description = "Finds the sermon inside a recorded church service, reviews the cut, renders an MP3"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3",
    "faster-whisper==1.2.1",
    "sherpa-onnx==1.13.8",
    "numpy",
    "flask",
    "waitress",
]

[project.scripts]
sermon-align = "sermon.cli:aligns"
sermon-analyze = "sermon.cli:analyzes"
sermon-approvals = "sermon.cli:reports_approvals"
sermon-corpus = "sermon.cli:derives_corpus"
sermon-fetch = "sermon.cli:fetches"
sermon-organize = "sermon.cli:organizes"
sermon-propose = "sermon.cli:proposes"
sermon-reconcile = "sermon.cli:reconciles"
sermon-regrade = "sermon.cli:regrades"
sermon-render = "sermon.cli:renders"
sermon-serve = "sermon.cli:serves"
sermon-work = "sermon.cli:works"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "setuptools>=80",
    "pytest-bdd==8.1.0",
    "playwright==1.63.0",
    "gherkin-official==29.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sermon" = ["names.toml"]
"sermon.analysis" = ["prompts/*.md"]
"sermon.web" = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:'maxsplit' is passed as positional argument:DeprecationWarning:gherkin.gherkin_line",
]
markers = [
    "ingestion: subsystem",
    "analysis: subsystem",
    "interface: subsystem",
    "processing: subsystem",
    "notifications: subsystem",
    "ops: subsystem",
    "happy-path: the main flow",
    "edge-case: a real failure mode",
    "assumption: invented to fill a gap; confirm before building",
    "needs-decision: blocked on a question in features/QUESTIONS.md",
    "deferred: specified and deliberately not in v1",
    "measured: a number here came from the corpus",
    "stated: the owner said this; a preference, not an observation",
    "policy: a decision about behaviour that nothing measured",
    "slow: touches real audio processing",
    "manual: verified by a human, not automatable",
    "mobile: must work on a phone",
]
