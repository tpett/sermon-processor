<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d0f12}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
</style>
</helmet>
<div style="--bg:#0d0f12;--panel:#14171b;--raised:#1b1f24;--line:#262b31;--line2:#343a42;--text:#e7e9ec;--muted:#9aa3ad;--accent:#5cc8e0;--accent-ink:#06222a;--warn:#f0b450;--mono:'JetBrains Mono',ui-monospace,monospace;width:390px;height:844px;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;overflow:hidden">

  <header style="display:flex;align-items:center;gap:8px;padding:8px 12px 8px 4px;border-bottom:1px solid var(--line);background:var(--panel)">
    <a href="PhoneList.dc.html" aria-label="Recordings" style="width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex:1;min-width:0">
      <h1 style="margin:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Sunday Service - Hebrews 13:7-8</h1>
      <div style="font-size:11px;color:var(--muted);font-family:var(--mono)">Sun 26 Oct · 09:00 · 2:14:06</div>
    </div>
    <button type="button" aria-label="Details" style="width:44px;height:44px;border-radius:8px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;position:relative">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg>
      <span style="position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--warn)"></span>
    </button>
  </header>

  <div style="flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:12px">
    <div style="display:flex;height:6px;border-radius:3px;overflow:hidden;gap:1px">
      <sc-for list="{{ bands }}" as="b" hint-placeholder-count="12">
        <div style="width:{{b.width}};background:{{b.color}};opacity:{{b.op}}"></div>
      </sc-for>
    </div>

    <section aria-label="Detail editor" style="border-radius:10px;background:var(--panel);border:1px solid var(--line);overflow:hidden">
      <div style="position:relative;height:150px">
        <div style="position:absolute;top:0;bottom:0;left:0;width:{{cut.inLeft}};background:rgba(0,0,0,0.35)"></div>
        <div style="position:absolute;inset:12px 0;display:flex;align-items:center;gap:1px">
          <sc-for list="{{ detail }}" as="b" hint-placeholder-count="90">
            <div style="flex:1 1 0;min-width:1px;height:{{b.h}};background:{{b.c}};border-radius:1px"></div>
          </sc-for>
        </div>
        <div style="position:absolute;top:0;bottom:0;left:{{cut.inLeft}};width:2px;margin-left:-1px;background:var(--accent)"></div>
        <div style="position:absolute;top:0;left:{{cut.inLeft}};padding:2px 6px;border-radius:0 4px 4px 0;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;font-family:var(--mono)">IN</div>
        <div style="position:absolute;top:0;bottom:0;left:{{cut.playLeft}};width:1px;background:#ffffff"></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--line)">
        <button type="button" aria-label="Play" style="width:44px;height:44px;border-radius:50%;border:0;background:var(--text);color:var(--bg);display:inline-flex;align-items:center;justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5l12 7-12 7z"></path></svg>
        </button>
        <span style="font-family:var(--mono);font-size:17px;font-weight:500;flex:1">1:02:13.80</span>
        <button type="button" aria-label="Zoom out" style="width:44px;height:44px;border-radius:8px;border:1px solid var(--line2);background:transparent;font-size:18px">−</button>
        <button type="button" aria-label="Zoom in" style="width:44px;height:44px;border-radius:8px;border:1px solid var(--line2);background:transparent;font-size:18px">+</button>
      </div>
      <div style="display:flex;align-items:center;gap:4px;padding:0 10px 8px;font-size:12px;color:var(--muted)">
        <span style="flex:1">Drag to select a span</span>
        <span>At playhead:</span>
        <button type="button" style="min-height:44px;padding:0 6px;border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline">set in</button>
        <button type="button" style="min-height:44px;padding:0 6px;border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline">set out</button>
      </div>
    </section>

    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <button type="button" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 12px;border-radius:22px;border:0;background:var(--text);color:var(--bg);font-size:13px;font-weight:700">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5l12 7-12 7z"></path></svg>
        Preview the cut
      </button>
      <button type="button" style="min-height:44px;padding:0 10px;border-radius:22px;border:1px solid rgba(240,180,80,0.45);background:transparent;font-size:12px">Opening</button>
      <button type="button" style="min-height:44px;padding:0 10px;border-radius:22px;border:1px solid var(--line2);background:transparent;font-size:12px">Join</button>
      <button type="button" style="min-height:44px;padding:0 10px;border-radius:22px;border:1px solid var(--line2);background:transparent;font-size:12px">Ending</button>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <sc-for list="{{ points }}" as="p" hint-placeholder-count="2">
        <div style="padding:10px;border-radius:8px;background:var(--panel);border:1px solid {{p.ring}}">
          <div style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)">{{p.name}}</div>
          <div style="font-family:var(--mono);font-size:15px;font-weight:500;margin:2px 0 8px">{{p.at}}</div>
          <div style="display:flex;gap:4px">
            <button type="button" aria-label="Nudge earlier" style="flex:1;min-height:44px;border-radius:6px;border:1px solid var(--line2);background:var(--raised);font-family:var(--mono);font-size:12px">−0.1</button>
            <button type="button" aria-label="Nudge later" style="flex:1;min-height:44px;border-radius:6px;border:1px solid var(--line2);background:var(--raised);font-family:var(--mono);font-size:12px">+0.1</button>
          </div>
        </div>
      </sc-for>
    </div>

    <div>
      <h3 style="margin:0 0 6px;font-size:13px;font-weight:600">Removed from inside · 0.8 s</h3>
      <ul style="list-style:none;margin:0;padding:0;border-radius:8px;border:1px solid var(--line);background:var(--panel)">
        <li style="display:flex;align-items:center;gap:4px;padding:0 4px 0 12px">
          <span style="font-family:var(--mono);font-size:12px;flex:1">1:02:21.2 – 1:02:22.0</span>
          <button type="button" style="min-height:44px;padding:0 8px;border:0;background:transparent;color:var(--accent);font-size:12px">Hear join</button>
          <button type="button" style="min-height:44px;padding:0 8px;border:0;background:transparent;color:var(--muted);font-size:12px">Put back</button>
        </li>
      </ul>
    </div>
  </div>

  <div style="display:flex;gap:8px;padding:10px 12px 14px;border-top:1px solid var(--line);background:var(--panel)">
    <a href="PhoneReview.dc.html" style="flex:1;min-height:48px;border-radius:10px;background:var(--text);color:var(--bg);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none">Done editing</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const n = (i) => { const x = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return x - Math.floor(x); };
    const pct = (v) => (v * 100).toFixed(3) + '%';
    const C = { sermon: '#7fb08c', music: '#a796c4', prayer: '#7fa3c4', scripture: '#d9a860', communion: '#c081a0', announcements: '#8a857c', other: '#7c766d' };
    const TOTAL = 8046, IN = 3734.5;
    const raw = [[0, 'other'], [760, 'music'], [1085, 'announcements'], [1470, 'music'], [2470, 'prayer'], [2815, 'scripture'], [3140, 'music'], [IN, 'sermon'], [6278, 'prayer'], [6430, 'communion'], [7125, 'music'], [7710, 'other']];
    const bands = raw.map((b, i) => {
      const end = i + 1 < raw.length ? raw[i + 1][0] : TOTAL;
      return { width: pct((end - b[0]) / TOTAL), color: C[b[1]], op: b[1] === 'sermon' ? 1 : 0.45 };
    });
    const W0 = 3724, WL = 20;
    const detail = Array.from({ length: 90 }, (_, i) => {
      const t = W0 + (i + 0.5) / 90 * WL; let a;
      if (t < 3732.6) a = (0.55 + 0.35 * n(i + 7)) * (t > 3730 ? (3732.6 - t) / 2.6 : 1);
      else if (t < 3735.0) a = 0.04;
      else { const g = Math.abs(Math.sin((t - 3735) * 2.7)) * Math.abs(Math.sin((t - 3735) * 0.9 + 0.4)); a = 0.06 + 0.75 * g * (0.6 + 0.4 * n(i + 3)); }
      return { h: Math.max(2, a * 100).toFixed(0) + '%', c: t < IN ? '#4a525c' : '#d6dee6' };
    });
    const at = (t) => pct((t - W0) / WL);
    return {
      bands, detail,
      cut: { inLeft: at(IN), playLeft: at(3733.8) },
      points: [{ name: 'Punch in', at: '1:02:14.50', ring: 'var(--accent)' }, { name: 'Punch out', at: '1:44:38.00', ring: 'var(--line)' }]
    };
  }
}
</script>
</body>
</html>
