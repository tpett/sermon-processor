<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d0f12}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
</style>
</helmet>
<div style="--bg:#0d0f12;--panel:#14171b;--raised:#1b1f24;--line:#262b31;--line2:#343a42;--text:#e7e9ec;--muted:#9aa3ad;--accent:#5cc8e0;--accent-ink:#06222a;--warn:#f0b450;--mono:'JetBrains Mono',ui-monospace,monospace;width:390px;height:844px;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;overflow:hidden">

  <header style="display:flex;align-items:center;gap:4px;padding:8px 8px 8px 4px;border-bottom:1px solid var(--line);background:var(--panel)">
    <a href="PhoneList.dc.html" aria-label="Recordings" style="width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex:1;min-width:0">
      <h1 style="margin:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Sunday Service - Hebrews 13:7-8</h1>
      <div style="font-size:11px;color:var(--muted);font-family:var(--mono)">Sun 26 Oct · 09:00 · 2:14:06</div>
    </div>
    <a href="Phone.dc.html" style="min-height:44px;padding:0 10px;display:inline-flex;align-items:center;color:var(--text);font-size:13px;font-weight:600;text-decoration:none">Edit</a>
    <button type="button" aria-label="Details" style="width:44px;height:44px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;position:relative">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg>
      <span style="position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--warn)"></span>
    </button>
  </header>

  <div style="flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:14px 12px">
    <div style="display:flex;height:6px;border-radius:3px;overflow:hidden;gap:1px">
      <sc-for list="{{ bands }}" as="b" hint-placeholder-count="12">
        <div style="width:{{b.width}};background:{{b.color}};opacity:{{b.op}}"></div>
      </sc-for>
    </div>

    <section aria-label="The cut" style="display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:12px;background:var(--panel);border:1px solid var(--line)">
      <div>
        <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)"><span style="width:8px;height:8px;border-radius:2px;background:#7fb08c"></span>Sermon</div>
        <h2 style="margin:2px 0;font-size:20px;font-weight:600">Hebrews 13.7-8</h2>
        <div style="font-family:var(--mono);font-size:12px;color:var(--muted)">42:22.7 · 0.8 s removed</div>
      </div>
      <button type="button" style="display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:26px;border:0;background:var(--text);color:var(--bg);font-size:15px;font-weight:700">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5l12 7-12 7z"></path></svg>
        Preview the cut
      </button>
      <ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px">
        <sc-for list="{{ seams }}" as="s" hint-placeholder-count="3">
          <li style="display:flex;align-items:center;gap:10px;padding:6px 6px 6px 10px;border-radius:8px;background:var(--bg);border:1px solid {{s.ring}}">
            <span style="flex:1;min-width:0">
              <span style="display:block;font-size:13px;font-weight:600">{{s.name}}</span>
              <span style="display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{s.words}}</span>
            </span>
            <button type="button" aria-label="{{s.hear}}" style="width:44px;height:44px;border-radius:8px;border:1px solid var(--line2);background:transparent;display:inline-flex;align-items:center;justify-content:center">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5l12 7-12 7z"></path></svg>
            </button>
          </li>
        </sc-for>
      </ol>
    </section>

    <div style="padding:10px 12px;border-radius:8px;background:rgba(240,180,80,0.10);color:#f6d29a;font-size:13px">
      <strong style="color:var(--warn)">Check the opening.</strong> Listen before approving.
    </div>

    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">
      Publication label
      <input type="text" value="Hebrews 13.7-8" style="min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);font-size:15px;font-weight:400">
    </label>
    <div role="radiogroup" aria-label="Intent" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:3px;border-radius:8px;background:var(--panel);border:1px solid var(--line)">
      <button type="button" role="radio" aria-checked="true" style="min-height:40px;border:0;border-radius:6px;background:var(--raised);font-size:13px;font-weight:500">Publish</button>
      <button type="button" role="radio" aria-checked="false" style="min-height:40px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:13px;font-weight:500">Archive</button>
    </div>
  </div>

  <div style="display:flex;gap:8px;padding:10px 12px 14px;border-top:1px solid var(--line);background:var(--panel)">
    <button type="button" style="flex:0 0 88px;min-height:48px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-size:14px">Skip</button>
    <button type="button" style="flex:1;min-height:48px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:700">Approve and render</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { sermon: '#7fb08c', music: '#a796c4', prayer: '#7fa3c4', scripture: '#d9a860', communion: '#c081a0', announcements: '#8a857c', other: '#7c766d' };
    const TOTAL = 8046;
    const raw = [[0, 'other'], [760, 'music'], [1085, 'announcements'], [1470, 'music'], [2470, 'prayer'], [2815, 'scripture'], [3140, 'music'], [3734.5, 'sermon'], [6278, 'prayer'], [6430, 'communion'], [7125, 'music'], [7710, 'other']];
    const bands = raw.map((b, i) => {
      const end = i + 1 < raw.length ? raw[i + 1][0] : TOTAL;
      return { width: ((end - b[0]) / TOTAL * 100).toFixed(2) + '%', color: C[b[1]], op: b[1] === 'sermon' ? 1 : 0.45 };
    });
    return {
      bands,
      seams: [
        { name: 'Opening · 1:02:14.5', words: 'music | Good morning. If you have your Bibles…', hear: 'Hear the opening', ring: 'rgba(240,180,80,0.45)' },
        { name: 'Removal · 0.8 s', words: '…Hebrews thirteen. | We’re going to look at…', hear: 'Hear the join', ring: 'var(--line)' },
        { name: 'Ending · 1:44:38.0', words: '…in Jesus’ name. Amen. | prayer response', hear: 'Hear the ending', ring: 'var(--line)' }
      ]
    };
  }
}
</script>
</body>
</html>
