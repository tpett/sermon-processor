<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recordings on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d0f12}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="--bg:#0d0f12;--panel:#14171b;--raised:#1b1f24;--line:#262b31;--line2:#343a42;--text:#e7e9ec;--muted:#9aa3ad;--accent:#5cc8e0;--accent-ink:#06222a;--warn:#f0b450;--bad:#ef7b78;--mono:'JetBrains Mono',ui-monospace,monospace;width:390px;height:844px;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;overflow:hidden">

  <header style="display:flex;align-items:center;gap:4px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line);background:var(--panel)">
    <h1 style="margin:0;font-size:17px;font-weight:600;flex:1">Recordings</h1>
    <button type="button" aria-label="Scan the bucket" style="width:44px;height:44px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 11-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
    </button>
    <a href="#" aria-label="Notifications, 2 unread" style="position:relative;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 01-3.4 0"></path></svg>
      <span style="position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent)"></span>
    </a>
  </header>

  <div style="flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:16px">
    <a href="Phone.dc.html" style="display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);color:var(--text);text-decoration:none">
      <span style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--warn)">Needs your review</span>
      <span>
        <span style="display:block;font-size:16px;font-weight:600">Sunday Service - Hebrews 13:7-8</span>
        <span style="display:block;font-size:12px;color:var(--muted);font-family:var(--mono)">Sun 26 Oct · 09:00 · 2:14:06</span>
      </span>
      <span style="display:flex;height:6px;border-radius:3px;overflow:hidden;gap:1px">
        <sc-for list="{{ bands }}" as="b" hint-placeholder-count="12">
          <span style="width:{{b.width}};background:{{b.color}};opacity:{{b.op}}"></span>
        </sc-for>
      </span>
      <span style="display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700">Review the sermon</span>
    </a>

    <ol style="list-style:none;margin:0;padding:0;border-radius:10px;border:1px solid var(--line);background:var(--panel);overflow:hidden">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
        <li style="border-top:1px solid {{r.sep}}">
          <sc-if value="{{ r.quiet }}" hint-placeholder-val="{{ false }}">
            <a href="#" style="display:flex;gap:10px;padding:6px 14px;font-size:12px;color:var(--muted);text-decoration:none;opacity:0.75">
              <span style="font-family:var(--mono)">{{r.when}}</span><span style="flex:1">Silence or noise</span><span style="font-family:var(--mono)">{{r.dur}}</span>
            </a>
          </sc-if>
          <sc-if value="{{ r.loud }}" hint-placeholder-val="{{ true }}">
            <a href="#" style="display:flex;flex-direction:column;gap:3px;padding:12px 14px;min-height:44px;color:var(--text);text-decoration:none">
              <span style="font-size:14px;font-weight:500;color:{{r.titleColor}}">{{r.title}}</span>
              <span style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)">
                <span style="font-family:var(--mono)">{{r.when}}</span>
                <span style="padding:0 5px;border-radius:4px;border:1px solid var(--line2);font-family:var(--mono);font-size:11px">{{r.tag}}</span>
                <span style="flex:1"></span>
                <span style="display:inline-flex;align-items:center;gap:6px;color:{{r.stColor}}"><span style="width:6px;height:6px;border-radius:50%;background:{{r.stColor}}"></span>{{r.status}}</span>
              </span>
            </a>
          </sc-if>
        </li>
      </sc-for>
    </ol>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { sermon: '#7fb08c', music: '#a796c4', prayer: '#7fa3c4', scripture: '#d9a860', communion: '#c081a0', announcements: '#8a857c', other: '#7c766d' };
    const TOTAL = 8046;
    const raw = [[0, 'other'], [760, 'music'], [1085, 'announcements'], [1470, 'music'], [2470, 'prayer'], [2815, 'scripture'], [3140, 'music'], [3734.5, 'sermon'], [6278, 'prayer'], [6430, 'communion'], [7125, 'music'], [7710, 'other']];
    const bands = raw.map((b, i) => {
      const end = i + 1 < raw.length ? raw[i + 1][0] : TOTAL;
      return { width: ((end - b[0]) / TOTAL * 100).toFixed(2) + '%', color: C[b[1]], op: b[1] === 'sermon' ? 1 : 0.45 };
    });
    const ST = { analysing: ['Analysing', 'var(--accent)'], published: ['Published', 'var(--muted)'], archived: ['Archived', 'var(--muted)'], nothing: ['Nothing to publish', 'var(--muted)'], failed: ['Ingest failed', 'var(--bad)'] };
    const row = (when, title, tag, dur, st, quiet) => ({
      when, title, tag, dur, quiet: !!quiet, loud: !quiet,
      status: ST[st] ? ST[st][0] : '', stColor: ST[st] ? ST[st][1] : 'var(--muted)',
      titleColor: title.startsWith('Untitled') ? 'var(--muted)' : 'var(--text)'
    });
    const rows = [
      row('26 Oct 18:02', 'Untitled recording', '—', '1:31:44', 'analysing'),
      row('26 Oct 12:29', '', '', '10:42', '', true),
      row('26 Oct 08:15', 'Pre-Service Rehearsal', 'Rehearsal', '41:20', 'nothing'),
      row('19 Oct 12:31', '', '', '11:05', '', true),
      row('19 Oct 09:00', 'Theological Equipping Class - Giving, then Sunday Service - Hebrews 13:1-6', 'TEC', '3:02:18', 'published'),
      row('15 Oct 19:00', 'Members Meeting - Budget', 'Meeting', '1:12:40', 'archived'),
      row('12 Oct 10:58', 'Culture and Theology - Islam', 'CT', '58:12', 'published'),
      row('12 Oct 09:00', 'Sunday Service - Hebrews 12:25-29', 'Service', '2:09:51', 'published'),
      row('5 Oct 09:00', 'Untitled recording', '—', '—', 'failed')
    ];
    rows.forEach((r, i) => { r.sep = i === 0 ? 'transparent' : 'var(--line)'; });
    return { bands, rows };
  }
}
</script>
</body>
</html>
