<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='review.css') }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230d0f12'/%3E%3Cpath d='M3 8h2V5h2v6h2V3h2v10h2V8h0' fill='none' stroke='%235cc8e0' stroke-width='1.4'/%3E%3C/svg%3E">
</head>
<body>
<h1>Sign in</h1>
{% if message %}<p class="notice" data-field="sign-in-message" role="alert">{{ message }}</p>{% endif %}
<form method="post" action="/login" data-role="sign-in">
  <label>Email address
    <input type="email" name="email" autocomplete="username" autofocus required>
  </label>
  <label>Password
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <input type="hidden" name="next" value="{{ destination or '/' }}">
  <button type="submit" data-field="sign-in-control">Sign in</button>
</form>
</body>
</html>
